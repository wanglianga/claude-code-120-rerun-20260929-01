services:
  postgres:
    image: postgres:15-alpine
    container_name: seafood-postgres
    environment:
      POSTGRES_USER: seafood
      POSTGRES_PASSWORD: seafood
      POSTGRES_DB: seafood
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seafood -d seafood"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seafood-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seafood-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: seafood
      PGPASSWORD: seafood
      PGDATABASE: seafood
      PGSSLMODE: disable
      REDIS_ADDR: redis:6379
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
