services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: seafood
      POSTGRES_PASSWORD: seafood
      POSTGRES_DB: seafood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seafood -d seafood"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://seafood:seafood@db:5432/seafood?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      HTTP_ADDR: ":8080"
      MIGRATIONS_DIR: "/app/migrations"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
